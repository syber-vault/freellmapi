services:
  - type: web
    name: freellmapi
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY
        sync: false
    # NOTE: do NOT set PORT here - Render injects its own PORT env var and
    # routes traffic to it. FreeLLMAPI reads PORT from the environment.
    # ENCRYPTION_KEY is sync: false, so Render asks for it when the
    # Blueprint is applied - set a fresh 64-char hex key there.
    # NOTE: on the free plan there is no persistent disk, so the SQLite
    # database at server/data/freeapi.db lives on ephemeral storage -
    # a redeploy may wipe it and keys / the dashboard account would
    # need re-adding. Sleep after ~15 min idle (~50s to wake) is normal.
